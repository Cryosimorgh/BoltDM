name: Test

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Go test
        run: go test ./...
      - name: Go vet
        run: go vet ./...
      - name: Build application
        run: go build ./cmd/boltdm
      - name: Build launcher
        run: go build ./cmd/launcher
      - name: Generate and verify icon assets
        shell: bash
        run: |
          go run ./cmd/icon-gen
          test -s BoltDM.ico
          test -s extension/icons/icon16.png
          test -s extension/icons/icon32.png
          test -s extension/icons/icon48.png
          test -s extension/icons/icon128.png
      - name: Build updater
        run: go build ./cmd/updater
      - name: JavaScript syntax
        run: |
          node --check internal/server/web/core.js
          node --check internal/server/web/settings.js
          node --check internal/server/web/events.js
          node --check extension/content.js
          node --check extension/popup.js
          node --check extension/service_worker.js
          node --test extension/service_worker.test.cjs
      - name: Linux packaging script syntax
        if: runner.os == 'Linux'
        run: bash -n build.sh install-linux.sh
      - name: Linux package smoke test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x build.sh install-linux.sh
          BOLTDM_SKIP_CHECKS=1 BOLTDM_TARGET_OS=linux BOLTDM_TARGET_ARCH=amd64 ./build.sh
          test -x dist/boltdm-linux-amd64/boltdm
          test -x dist/boltdm-linux-amd64/boltdm-updater
          test -f dist/BoltDM-linux-amd64.tar.gz
          test -f dist/BoltDM-linux-amd64.tar.gz.sha256

  windows-installer:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Build Windows binaries and icons
        shell: powershell
        run: .\build.ps1
      - name: Prepare installer payload
        shell: powershell
        run: |
          $dir = 'dist\BoltDM-windows-amd64'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item 'dist\BoltDM.exe', 'dist\BoltDM-Launcher.exe', 'dist\BoltDM.ico' $dir
          Copy-Item 'extension' "$dir\BoltDM-Companion" -Recurse
          Copy-Item 'Install-BoltDM.cmd' $dir
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile "$dir\yt-dlp.exe"
          & "$dir\yt-dlp.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'yt-dlp verification failed' }
      - name: Install Inno Setup compiler
        shell: powershell
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --yes --no-progress --limit-output
          }
      - name: Validate five browser setup choices
        shell: powershell
        run: |
          $helper = '.\packaging\windows\Install-Extension.ps1'
          foreach ($browser in @('Chrome','Edge','Brave','Opera','Firefox')) {
            $result = & $helper -Browser $browser -ExtensionPath 'extension' -CheckOnly | ConvertFrom-Json
            if ($result.browser -ne $browser -or $null -eq $result.installed) {
              throw "Browser detection failed: $browser"
            }
            Write-Host "$browser installed=$($result.installed)"
          }
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $helper).Path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }

      - name: Compile setup executable
        shell: powershell
        run: .\packaging\windows\Build-Installer.ps1
      - name: Smoke-test setup and uninstall
        shell: powershell
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'BoltDM-smoke'
          $installer = (Resolve-Path 'dist\BoltDM-Setup-windows-amd64.exe').Path
          $p = Start-Process -FilePath $installer -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$target") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Setup failed: $($p.ExitCode)" }
          foreach ($file in @('BoltDM.exe', 'BoltDM-Launcher.exe', 'BoltDM.ico', 'BoltDM-Companion\manifest.json')) {
            if (-not (Test-Path (Join-Path $target $file))) { throw "Missing installed file: $file" }
          }
          $uninstall = Join-Path $target 'unins000.exe'
          if (-not (Test-Path $uninstall)) { throw 'Uninstaller missing' }
          $p = Start-Process -FilePath $uninstall -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART') -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }
          if (Test-Path (Join-Path $target 'BoltDM.exe')) { throw 'Uninstaller left BoltDM.exe' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer-preview
          path: |
            dist/BoltDM-Setup-windows-amd64.exe
            dist/BoltDM-Setup-windows-amd64.exe.sha256
          if-no-files-found: error
